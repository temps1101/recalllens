AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Account-free Recalllens photo and OpenCV feature-pair delivery.

Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Shared demo token sent in the x-api-key header.
  BillingEmail:
    Type: String
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Enter an email address for AWS cost alerts.
    Description: Email address that receives the Recalllens cost alerts.

Resources:
  VerificationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DefaultRouteSettings:
        ThrottlingBurstLimit: 2
        ThrottlingRateLimit: 1

  VerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 10
      Environment:
        Variables:
          API_TOKEN: !Ref ApiToken
          SHARE_BUCKET: !Ref SharedPhotos
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "${SharedPhotos.Arn}/shares/*"
      Events:
        CreateShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VerificationApi
            Method: POST
            Path: /shares
        ReceiveShare:
          Type: HttpApi
          Properties:
            ApiId: !Ref VerificationApi
            Method: GET
            Path: /shares/{shareId}
        ShareLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref VerificationApi
            Method: GET
            Path: /s/{shareId}
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: opencv5-v1

  VerificationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${VerificationFunction}"
      RetentionInDays: 3

  SharedPhotos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSharedPhotos
            Status: Enabled
            ExpirationInDays: 30
            Prefix: shares/

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: WeirdBoots-Monthly-Cost
        BudgetLimit:
          Amount: 1
          Unit: USD
        BudgetType: COST
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 0.10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BillingEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 1
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BillingEmail
              SubscriptionType: EMAIL

Outputs:
  VerificationEndpoint:
    Description: Configure this sharing URL as WBCloudVerificationURL in the iOS target.
    Value: !Sub "https://${VerificationApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/shares"
