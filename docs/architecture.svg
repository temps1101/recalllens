<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Recalllens local matching and optional AWS sharing architecture</title>
  <desc id="desc">Capture and matching stay on the iPhone. Only an explicit Share action sends an image and OpenCV feature signature to AWS for validation and temporary delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#334155"/></marker>
    <style>.title{font:700 30px -apple-system,sans-serif;fill:#0f172a}.head{font:700 19px -apple-system,sans-serif;fill:#0f172a}.body{font:16px -apple-system,sans-serif;fill:#334155}.small{font:14px -apple-system,sans-serif;fill:#475569}.box{fill:#fff;stroke:#64748b;stroke-width:2}.local{fill:#eff6ff;stroke:#2563eb}.share{fill:#fff7ed;stroke:#ea580c}.result{fill:#f0fdf4;stroke:#16a34a}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Recalllens — local recall, optional AWS sharing</text>
  <rect x="45" y="92" width="1110" height="245" rx="24" class="box local"/>
  <text x="75" y="130" class="head">Everyday use · entirely on iPhone</text>
  <rect x="75" y="165" width="190" height="105" rx="15" class="box"/>
  <text x="104" y="206" class="head">Camera / capture</text><text x="104" y="237" class="body">No network request</text>
  <rect x="320" y="155" width="280" height="125" rx="15" class="box"/>
  <text x="348" y="196" class="head">OpenCV 5 on-device</text><text x="348" y="226" class="body">ORB · Hamming KNN</text><text x="348" y="252" class="body">RANSAC homography</text>
  <rect x="655" y="155" width="220" height="125" rx="15" class="box"/>
  <text x="683" y="196" class="head">Private archive</text><text x="683" y="226" class="body">JPEG + ORB signature</text><text x="683" y="252" class="small">App container</text>
  <rect x="930" y="165" width="190" height="105" rx="15" class="box result"/>
  <text x="958" y="205" class="head">Local recall</text><text x="958" y="236" class="body">All scene matches</text>
  <path d="M265 217H320" class="line"/><path d="M600 217H655" class="line"/><path d="M875 217H930" class="line"/>
  <rect x="45" y="375" width="1110" height="245" rx="24" class="box share"/>
  <text x="75" y="413" class="head">Only when Share is selected · temporary cross-device transfer</text>
  <rect x="75" y="455" width="180" height="105" rx="15" class="box"/>
  <text x="104" y="496" class="head">Share action</text><text x="104" y="527" class="small">Image + signature</text>
  <rect x="300" y="445" width="235" height="125" rx="15" class="box"/>
  <text x="328" y="484" class="head">Lambda · OpenCV 5</text><text x="328" y="514" class="body">Re-extract features</text><text x="328" y="540" class="body">Validate pair</text>
  <rect x="580" y="455" width="190" height="105" rx="15" class="box"/>
  <text x="608" y="496" class="head">Private S3</text><text x="608" y="527" class="small">Encrypted · 30 days</text>
  <rect x="815" y="445" width="305" height="125" rx="15" class="box result"/>
  <text x="843" y="484" class="head">Recipient iPhone</text><text x="843" y="514" class="body">Download pair once</text><text x="843" y="540" class="body">Then match locally / offline</text>
  <path d="M255 507H300" class="line"/><path d="M535 507H580" class="line"/><path d="M770 507H815" class="line"/>
  <text x="55" y="657" class="small">No DynamoDB registry · no live-frame upload · no AWS dependency during capture or recall</text>
</svg>
